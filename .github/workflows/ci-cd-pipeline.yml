name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

env:
  VPS_IP: ${{ secrets.VPS_IP }}
  VPS_USER: ${{ secrets.VPS_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  APP_KEY: ${{ secrets.APP_KEY }}
  ADMIN_EMAIL: frankie@cannabica.app
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  APP_ENV: production
  APP_DEBUG: false
  CACHE_DRIVER: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync
  SEED_EXAMPLE_DATA: false

jobs:
  prepare:
    name: Prepare Version & Tags
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.compute_tag.outputs.tag }}
      should_release: ${{ steps.should_release.outputs.flag }}
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get version from composer.json
        id: get_version
        run: |
          echo "version=$(php -r "echo json_decode(file_get_contents('composer.json'))->version;")" >> $GITHUB_OUTPUT

      - name: Compute Tag
        id: compute_tag
        run: |
          ref="${{ github.ref }}"
          version="${{ steps.get_version.outputs.version }}"
          tag=""

          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            tag="pr-${{ github.event.pull_request.number }}"
          else
            is_hotfix_merge=false
            if [[ "${{ github.event.head_commit.message }}" =~ ^Merge\ pull\ request.*from.*hotfix/ ]]; then
              is_hotfix_merge=true
            fi

            if [[ "$ref" == "refs/heads/main" ]]; then
              if [[ "$is_hotfix_merge" == "true" ]]; then
                IFS='.' read -r major minor patch <<< "$version"
                next_patch=$((patch + 1))
                tag="v${major}.${minor}.${next_patch}"
              else
                tag="v${version}"
              fi
            elif [[ "$ref" =~ ^refs/heads/hotfix/ ]]; then
              tag="v${version}-hotfix"
            elif [[ "$ref" == "refs/heads/develop" ]]; then
              if [[ "$is_hotfix_merge" == "true" ]]; then
                IFS='.' read -r major minor patch <<< "$version"
                next_patch=$((patch + 1))
                tag="v${major}.${minor}.${next_patch}"
              else
                IFS='.' read -r major minor patch <<< "$version"
                next_minor=$((minor + 1))
                tag="v${major}.${next_minor}.0"
              fi
            elif [[ "$ref" =~ ^refs/heads/feature/ ]]; then
              tag="feature-${GITHUB_SHA::7}"
            else
              tag="sha-${GITHUB_SHA::7}"
            fi
          fi

          echo "Computed tag: $tag"
          echo "tag=${tag}" >> $GITHUB_OUTPUT

      - name: Determine if release
        id: should_release
        run: |
          flag="false"
          if [[ "${{ github.event_name }}" == "push" ]] && [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            flag="true"
          fi
          echo "flag=$flag" >> $GITHUB_OUTPUT

  build-and-scan:
    name: Build & Security Scan
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: |
            image=moby/buildkit:master
          install: true

      - name: Build PHP Docker Image (Local Storage)
        uses: docker/build-push-action@v4
        with:
          context: .
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/cannabica-php:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: docker/php/Dockerfile
          build-args: |
            COMPOSER_AUTH={"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}

      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/cannabica-php:${{ needs.prepare.outputs.tag }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          trivyignores: .trivyignore
          skip-files: 'usr/src/php/ext/fileinfo/data_file.c'

      - name: Login to Docker Hub
        if: needs.prepare.outputs.should_release == 'true'
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push PHP Docker Image
        if: needs.prepare.outputs.should_release == 'true'
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cannabica-php:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cannabica-php:${{ needs.prepare.outputs.tag }}
          cache-from: type=gha
          file: docker/php/Dockerfile
          build-args: |
            COMPOSER_AUTH={"github-oauth":{"github.com":"${{ secrets.GITHUB_TOKEN }}"}}

  release:
    name: Release & Version Bump
    needs: [prepare, build-and-scan]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Apply Git Tag
        run: |
          tag="${{ needs.prepare.outputs.tag }}"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists. No action taken."
          else
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git tag "$tag"
            git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
            git push origin "$tag"
          fi

      - name: Update version in composer.json
        run: |
          new_version=$(echo "${{ needs.prepare.outputs.tag }}" | sed 's/^v//')
          jq --arg v "$new_version" '.version = $v' composer.json > composer.tmp.json
          mv composer.tmp.json composer.json
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git add composer.json
          git commit -m "Bump version to ${new_version} [skip ci]" || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}

  deploy:
    name: Deploy to VPS
    needs: [prepare, build-and-scan, release]
    if: needs.prepare.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          port: 60022
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /home/${{ secrets.VPS_USER }}
            export DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/cannabica-php:${{ needs.prepare.outputs.tag }}

            # Inyecta las variables del bot admin en el .env del VPS (idempotente)
            ENV_FILE=/home/${{ secrets.VPS_USER }}/.env
            touch "$ENV_FILE"
            upsert_env() { key="${1%%=*}"; sed -i "/^${key}=/d" "$ENV_FILE"; printf '%s\n' "$1" >> "$ENV_FILE"; }
            upsert_env "TELEGRAM_ADMIN_BOT_TOKEN=${{ secrets.TELEGRAM_ADMIN_BOT_TOKEN }}"
            upsert_env "TELEGRAM_ADMIN_SECRET_TOKEN=${{ secrets.TELEGRAM_ADMIN_SECRET_TOKEN }}"
            upsert_env "TELEGRAM_ADMIN_ALLOWED_USER_IDS=${{ secrets.TELEGRAM_ADMIN_ALLOWED_USER_IDS }}"
            upsert_env "TELEGRAM_ADMIN_WEBHOOK_URL=${{ secrets.TELEGRAM_ADMIN_WEBHOOK_URL }}"
            upsert_env "TELEGRAM_ADMIN_DIGEST_ENABLED=${{ secrets.TELEGRAM_ADMIN_DIGEST_ENABLED }}"
            chmod 600 "$ENV_FILE"

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose pull php
            
            # Zero-downtime deployment by only recreating changed containers
            docker compose up -d --remove-orphans
            
            # Sync del public de la imagen al volumen compartido (public-php).
            # Caddy sirve los assets estáticos DESDE ese volumen; sin este sync el
            # volumen congela el public de un deploy viejo y tapa el build nuevo de la
            # imagen (incidente v0.20.0: UI sin marca + manifest viejo rompía artisan).
            PUBLIC_VOLUME=$(docker volume ls -q | grep 'public-php' | head -1)
            if [ -n "$PUBLIC_VOLUME" ]; then
              NEW_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/cannabica-php:${{ needs.prepare.outputs.tag }}"
              docker run --rm --user root --entrypoint sh -v "${PUBLIC_VOLUME}:/target" "$NEW_IMAGE" \
                -c 'rm -rf /target/build && cp -r /var/www/html/public/. /target/' \
                && echo "public sincronizado al volumen $PUBLIC_VOLUME" \
                || echo "WARN: sync del public al volumen fallo"
            else
              echo "WARN: no se encontro volumen public-php (saltando sync)"
            fi
            
            docker image prune -f