# CI — gate de calidad: tests + análisis estático + escaneo de vulnerabilidades.
#
# Contexto (WS2/T2.3): este workflow nace para que el merge tenga GATE. Reemplazo al pipeline viejo
# (`ci-cd-pipeline.yml` + `staging-deploy.yml`), BORRADOS en T3.3 el 2026-09-27: hoy el CI es este
# archivo y el release a GHCR vive en `release.yml`. El deploy a produccion NO corre desde aca: se
# dispara desde el repo de operacion `Cannabica/cannabica-deploy` (`deploy-prod.yml`, T1.5).
# Acá NO se publica nada ni se deploya: los 4 jobs son de verificación.
#
# POR QUÉ HAY PASOS DE NODE: el panel registra su CSS con `Vite::asset(...)` en `TenantPanelProvider::panel()`
# y eso corre al BOOTEAR la app. Sin `public/build/manifest.json`, no sólo fallan los tests: falla hasta
# `composer install` (post-autoload-dump → package:discover) y falla el bootstrap de larastan
# ("ViteManifestNotFoundException ... while loading bootstrap.php"). Evidencia medida en el informe de WS2 §3.2.
# Por eso ambos jobs construyen los assets primero, igual que el build de la imagen.
# (Alternativa evaluada y NO aplicada acá: el guard tolerante que `main` ya tiene desde el hotfix v0.20.1
#  —haría innecesario el build en CI—; es un cambio de código de producto y va como tarjeta aparte.)
#
# Las 4 actions están PINEADAS POR SHA (el pipeline viejo usa tags e incluso @master: no se copió eso).
# Los 4 nombres de job (`phpunit`, `phpstan`, `trivy`, `fugas`) son los que van como required status
# checks en branch protection de develop y main (necesita admin).
#
# EL REPO ES PÚBLICO: el job `fugas` (guard-fugas.sh + gitleaks) es el que impide que una credencial o
# un dato de infraestructura entren y queden indexados para siempre. Corre en el mismo evento que los
# otros tres (PR a develop/main y push a develop), así que no agrega tiempo al gate: es paralelo.

name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

# No necesita escribir nada: sólo leer el repo.
permissions:
  contents: read

# Si se pushea dos veces seguidas a la misma rama, cancela la corrida vieja (ahorra minutos).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: phpunit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, zip, gd, curl, dom, fileinfo
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: npm
      - name: Preparar entorno (.env del ejemplo)
        run: cp .env.example .env
      # ⚠️ EL ORDEN IMPORTA — bug encontrado en la 1.ª corrida real del gate (2026-09-27):
      #   - `composer install` CON scripts bootea la app (post-autoload-dump → package:discover) y el panel
      #     registra su CSS con `Vite::asset(...)` → sin `public/build/manifest.json` FALLA.
      #   - `npm run build` necesita `vendor/` (el `theme.css` de Filament vive ahí) → sin vendor FALLA.
      # Es un círculo; se rompe instalando SIN scripts, buildeando los assets, y recién ahí corriendo los
      # scripts de composer (que ya encuentran el manifest).
      - name: "composer install sin scripts (todavía no hay manifest de Vite)"
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Dependencias del frontend
        run: npm ci
      - name: Build de assets (Vite) — necesario para bootear el panel
        run: npm run build
      - name: "Scripts de composer (package:discover, ya con el manifest)"
        run: composer dump-autoload
      - name: APP_KEY
        run: php artisan key:generate
      # La suite corre con sqlite :memory: (phpunit.xml, T2.2): NO necesita servicio de base.
      - name: Tests
        run: php artisan test --testdox

  phpstan:
    name: phpstan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.3'
          extensions: mbstring, pdo_sqlite, sqlite3, bcmath, intl, zip, gd, curl, dom, fileinfo
          coverage: none
          tools: composer:v2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: '20'
          cache: npm
      - name: Preparar entorno (.env del ejemplo)
        run: cp .env.example .env
      # Mismo círculo que en `phpunit` (ver el comentario de ahí): sin scripts → build → scripts.
      - name: "composer install sin scripts (todavía no hay manifest de Vite)"
        run: composer install --prefer-dist --no-interaction --no-progress --no-scripts
      - name: Dependencias del frontend
        run: npm ci
      - name: Build de assets (Vite) — larastan bootea la app para resolver el container
        run: npm run build
      - name: "Scripts de composer (package:discover, ya con el manifest)"
        run: composer dump-autoload
      # `composer phpstan` = nivel 5 con larastan + baseline (T2.1): lo que NO está en el baseline,
      # rompe el gate. Los 4 hallazgos estructurales que PHPStan no deja baselinear están documentados
      # en phpstan.neon (exclusiones con comentario y ticket).
      - name: Análisis estático
        run: composer phpstan

  trivy:
    name: trivy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # POLÍTICA DE TRIVY (decidida en WS2, ver informe §3.2):
      #   - escanea el filesystem del repo (lee composer.lock): no necesita construir la imagen
      #     (eso ya lo hace el pipeline viejo con el scan de la imagen, que se queda como está) y así
      #     el job tarda segundos en vez de minutos.
      #   - rompe con CRITICAL/HIGH QUE TENGAN FIX (`ignore-unfixed`), para no bloquear por CVEs de
      #     base image sin parche disponible.
      #   - la única excepción aceptada está en `.trivyignore` (advisory de Laravel 10 sin fix en la
      #     rama: la deuda es la migración de T5.5). Un advisory nuevo → el job falla.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table

  # El guard de fugas: el repo es PÚBLICO, así que todo lo que entra queda indexado para siempre
  # (aunque se borre en el commit siguiente, la historia lo conserva). Dos capas complementarias:
  #   1. `scripts/guard-fugas.sh`  → infraestructura de la instancia + identidad personal
  #      (IPs, puertos, hosts, rutas del server, usuario/emails). Bloquea; la marca sólo avisa.
  #   2. `gitleaks`               → secretos (identificadores, tokens, claves) por regla + entropía,
  #      sobre la HISTORIA COMPLETA. Excepciones aprobadas en `.gitleaks.toml`.
  fugas:
    name: fugas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # gitleaks escanea la historia: sin esto sólo vería el último commit

      - name: Guard de fugas (infraestructura + identidad) — archivos trackeados
        run: python3 scripts/guard-fugas.py

      # gitleaks por BINARIO OFICIAL y no con `gitleaks/gitleaks-action`: esa action exige licencia
      # (GITLEAKS_LICENSE) en repos de ORGANIZACIÓN. El binario es gratis, no depende de una action
      # de terceros y queda pineado por versión Y por sha256 (contrastado con
      # gitleaks_8.28.0_checksums.txt; si GitHub sirviera otro archivo, `sha256sum -c` corta antes
      # de ejecutar nada).
      - name: gitleaks (secretos, historia completa)
        env:
          GL_VERSION: 8.28.0
          GL_SHA256: a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb
        run: |
          set -euo pipefail
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GL_VERSION}/gitleaks_${GL_VERSION}_linux_x64.tar.gz"
          echo "${GL_SHA256}  /tmp/gitleaks.tar.gz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks detect --source=. --config=.gitleaks.toml --redact --no-banner --exit-code=1
          echo "gitleaks OK: sin hallazgos (excepciones aprobadas en .gitleaks.toml)"
