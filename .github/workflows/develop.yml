name: CI/CD Pipeline

on:
  push:
    branches: [main, develop, 'feature/*', 'hotfix/*']
  pull_request:
    branches: [main, develop]

permissions:
  contents: write

env:
  VPS_IP: ${{ secrets.VPS_IP }}
  VPS_USER: ${{ secrets.VPS_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  APP_KEY: ${{ secrets.APP_KEY }}
  ADMIN_EMAIL: frankie@cannabica.app
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  APP_ENV: production
  APP_DEBUG: false
  CACHE_DRIVER: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync
  SEED_EXAMPLE_DATA: false

jobs:
  build:
    outputs:
      tag: ${{ steps.create_tag.outputs.tag }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get version from composer.json
        id: get_version
        run: |
          echo "version=$(php -r "echo json_decode(file_get_contents('composer.json'))->version;")" >> $GITHUB_OUTPUT

      - name: Create semantic version tag
        id: create_tag
        if: github.event_name == 'push'
        run: |
          ref="${{ github.ref }}"
          version="${{ steps.get_version.outputs.version }}"
          
          # Check if this is a merge from a hotfix branch
          is_hotfix_merge=false
          if [[ "${{ github.event.head_commit.message }}" =~ ^Merge\ pull\ request.*from.*hotfix/ ]]; then
            is_hotfix_merge=true
          fi
          
          if [[ "$ref" == "refs/heads/main" ]]; then
            if [[ "$is_hotfix_merge" == "true" ]]; then
              # For main with hotfix merge: increment patch version (X.Y.Z+1)
              IFS='.' read -r major minor patch <<< "$version"
              next_patch=$((patch + 1))
              tag="v${major}.${minor}.${next_patch}"
            else
              # For main without hotfix: tag vX.Y.Z
              tag="v${version}"
            fi
          elif [[ "$ref" =~ ^refs/heads/hotfix/ ]]; then
            # For hotfix branches: tag vX.Y.Z
            tag="v${version}"
          elif [[ "$ref" == "refs/heads/develop" ]]; then
            if [[ "$is_hotfix_merge" == "true" ]]; then
              # For develop with hotfix merge: increment patch version (X.Y.Z+1)
              IFS='.' read -r major minor patch <<< "$version"
              next_patch=$((patch + 1))
              tag="v${major}.${minor}.${next_patch}"
            else
              # For develop without hotfix: increment minor version (X.Y+1.0)
              IFS='.' read -r major minor patch <<< "$version"
              next_minor=$((minor + 1))
              tag="v${major}.${next_minor}.0"
            fi
          else
            echo "No tag created for branch $ref."
            exit 0
          fi

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists. No action taken."
          else
            git tag "$tag"
          fi
          echo "tag=${tag}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: |
            image=moby/buildkit:master
          install: true

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build PHP Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cannabica-php:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cannabica-php:${{ steps.create_tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: docker/php/Dockerfile

      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/cannabica-php:${{ steps.create_tag.outputs.tag }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          skip-files: 'usr/src/php/ext/fileinfo/data_file.c'

      - name: Update version in composer.json
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && success()
        run: |
          new_version=$(echo "${{ steps.create_tag.outputs.tag }}" | sed 's/^v//')
          jq --arg v "$new_version" '.version = $v' composer.json > composer.tmp.json
          mv composer.tmp.json composer.json
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add composer.json
          git commit -m "Bump version to ${new_version} [skip ci]"

      - name: Push version changes and tag
        if: github.event_name == 'push' && (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/main') && success()
        run: |
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          if [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            git push origin HEAD:develop
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            git push origin HEAD:main
          fi
          git push origin "${{ steps.create_tag.outputs.tag }}"
          git config --global core.fileMode false

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.V PS_IP }}
          username: ${{ secrets.VPS_USER }}
          port: 60022
          key: ${{ secrets.VPS_KEY }}
          script: |
            cd /home/almalinux
            export DOCKER_IMAGE=${{ secrets.DOCKERHUB_USERNAME }}/cannabica-php:${{ needs.build.outputs.tag }}

            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin
            docker compose pull php
            
            docker compose down

            docker compose up -d --remove-orphans
            
            docker image prune -f