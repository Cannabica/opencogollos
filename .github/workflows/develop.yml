name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*', 'hotfix/*' ]
  pull_request:
    branches: [ main, develop ]

env:
  VPS_IP: ${{ secrets.VPS_IP }}
  VPS_USER: ${{ secrets.VPS_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  APP_KEY: ${{ secrets.APP_KEY }}
  ADMIN_EMAIL: frankie@cannabica.app
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  APP_ENV: production
  APP_DEBUG: false
  CACHE_DRIVER: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync
  SEED_EXAMPLE_DATA: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: |
            image=moby/buildkit:master
          install: true

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Update composer.json version
        if: github.event_name == 'push'
        run: |
          version="${{ steps.get_version.outputs.version }}"
          ref="${{ github.ref }}"
          
          if [[ "$ref" == "refs/heads/develop" ]]; then
            # Para develop: incrementar minor semántico (X.Y+1.0)
            IFS='.' read -r major minor patch <<< "$version"
            next_minor=$((minor + 1))
            new_version="${major}.${next_minor}.0"
            jq --arg v "$new_version" '.version = $v' composer.json > composer.tmp.json
            mv composer.tmp.json composer.json
            git config --global user.name "GitHub Actions"
            git config --global user.email "actions@github.com"
            git add composer.json
            git commit -m "Bump version to ${new_version} [skip ci]"
            git push
          fi

      - name: Build PHP Docker Image
        uses: docker/build-push-action@v4
        with:
          context: docker/php
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cannabica-php:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/cannabica-php:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cannabica-php:${{ steps.create_tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: docker/php/Dockerfile
          build-args: |
            ENV=production

      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/cannabica-php:${{ github.sha }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache


  tag-version:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get version from composer.json
        id: get_version
        run: echo "version=$(php -r "echo json_decode(file_get_contents('composer.json'))->version;")" >> $GITHUB_OUTPUT

      - name: Create semantic-minor tag on develop, or production tag on main/hotfix
        id: create_tag
        run: |
          ref="${{ github.ref }}"
          version="${{ steps.get_version.outputs.version }}"

          if [[ "$ref" == "refs/heads/main" ]] || [[ "$ref" =~ ^refs/heads/hotfix/ ]]; then
            # Para main y hotfix: tag vX.Y.Z
            tag="v${version}"
          
          elif [[ "$ref" == "refs/heads/develop" ]]; then
            # Para develop: incrementar minor semántico (X.Y+1.0)
            IFS='.' read -r major minor patch <<< "$version"
            next_minor=$((minor + 1))
            tag="v${major}.${next_minor}.0"

          else
            echo "No se crea tag para la rama $ref."
            exit 0
          fi

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "El tag $tag ya existe. No se realizará ninguna acción."
          else
            git tag "$tag"
            git push origin "$tag"
          fi
          echo "tag=${tag}" >> $GITHUB_OUTPUT
