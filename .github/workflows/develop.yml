name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*', 'hotfix/*' ]
  pull_request:
    branches: [ main, develop ]

env:
  VPS_IP: ${{ secrets.VPS_IP }}
  VPS_USER: ${{ secrets.VPS_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
  DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
  APP_KEY: ${{ secrets.APP_KEY }}
  ADMIN_EMAIL: frankie@cannabica.app
  ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
  APP_ENV: production
  APP_DEBUG: false
  CACHE_DRIVER: file
  SESSION_DRIVER: file
  QUEUE_CONNECTION: sync
  SEED_EXAMPLE_DATA: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get version from composer.json
        id: get_version
        run: echo "version=$(php -r "echo json_decode(file_get_contents('composer.json'))->version;")" >> $GITHUB_OUTPUT

      - name: Create semantic version tag
        id: create_tag
        if: github.event_name == 'push'
        run: |
          ref="${{ github.ref }}"
          version="${{ steps.get_version.outputs.version }}"

          if [[ "$ref" == "refs/heads/main" ]] || [[ "$ref" =~ ^refs/heads/hotfix/ ]]; then
            # For main and hotfix: tag vX.Y.Z
            tag="v${version}"
          elif [[ "$ref" == "refs/heads/develop" ]]; then
            # For develop: increment minor version (X.Y+1.0)
            IFS='.' read -r major minor patch <<< "$version"
            next_minor=$((minor + 1))
            tag="v${major}.${next_minor}.0"
          else
            echo "No tag created for branch $ref."
            exit 0
          fi

          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists. No action taken."
          else
            git tag "$tag"
            git push origin "$tag"
          fi
          echo "tag=${tag}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2
        with:
          driver-opts: |
            image=moby/buildkit:master
          install: true

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Update composer.json version
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        run: |
          # Use the tag we already created to update composer.json
          new_version=$(echo "${{ steps.create_tag.outputs.tag }}" | sed 's/^v//')
          jq --arg v "$new_version" '.version = $v' composer.json > composer.tmp.json
          mv composer.tmp.json composer.json
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          git add composer.json
          git commit -m "Bump version to ${new_version} [skip ci]"
          
          # Use GitHub token for authentication
          git remote set-url origin "https://x-access-token:${{ secrets.FRANKIE_GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"
          git push origin HEAD:develop
          
          # Reset file modes if needed
          git config --global core.fileMode false

      - name: Build PHP Docker Image
        uses: docker/build-push-action@v4
        with:
          context: docker/php
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cannabica-php:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cannabica-php:${{ steps.create_tag.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          file: docker/php/Dockerfile
          build-args: |
            ENV=develop

      - name: Scan Docker Image for Vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/cannabica-php:${{ steps.create_tag.outputs.tag }}
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache


