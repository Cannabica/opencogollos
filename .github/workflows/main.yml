name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop, 'feature/*', 'hotfix/*' ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite3, pdo_sqlite
          coverage: none

      - name: Copy .env
        run: php -r "file_exists('.env') || copy('.env.example', '.env');"

      - name: Install Dependencies
        run: composer install -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Generate key
        run: php artisan key:generate

      - name: Directory Permissions
        run: chmod -R 777 storage bootstrap/cache

      - name: Create Database
        run: |
          mkdir -p database
          touch database/cannabica_db.sqlite

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          cache: 'npm'

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend
        run: npm run build

      - name: Run Database Migrations
        run: php artisan migrate --force

  tag-version:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Get version from composer.json
        id: get_version
        run: echo "version=$(php -r "echo json_decode(file_get_contents('composer.json'))->version;")" >> $GITHUB_OUTPUT

      - name: Create tag based on branch
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            tag="v${{ steps.get_version.outputs.version }}"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            tag="v${{ steps.get_version.outputs.version }}-beta"
          elif [[ "${{ github.ref }}" =~ ^refs/heads/feature/ ]]; then
            tag="v${{ steps.get_version.outputs.version }}-alpha"
          elif [[ "${{ github.ref }}" =~ ^refs/heads/hotfix/ ]]; then
            tag="v${{ steps.get_version.outputs.version }}-hotfix"
          fi
          git tag $tag
          git push origin $tag

  docker:
    needs: [build, tag-version]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop')
    steps:
      - uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/cannabica:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/cannabica:${{ github.sha }}