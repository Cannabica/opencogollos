# Release — en push a main: tag semver desde composer.json + imagen en GHCR.
#
# Contexto (WS2/T2.4): es el ÚNICO release desde que T3.3 borró el pipeline viejo (`ci-cd-pipeline.yml`
# + `staging-deploy.yml`, 2026-09-27). Antes convivían y esa convivencia se midió (informe de WS2 §3.3);
# ya no aplica ni el build duplicado ni el registry de Docker Hub (`cannabica/cannabica-php`), que era
# de una cuenta personal y quedó fuera del camino de la apertura.
#   - Evento: push a `main`; fuente de la versión: `composer.json` (mismo tag `vX.Y.Z`).
#   - Registry: `ghcr.io/cannabica/opencogollos` (el canónico de T0.2), con el `GITHUB_TOKEN` — cero secrets.
#   - El deploy NO está acá: sale del repo de operación (`deploy-prod.yml`, T1.5).
#
# Guarda: si el tag ya existe apuntando a OTRO commit, este workflow
# FALLA con un error explícito en vez de saltear el tag en silencio (eso hacía el pipeline viejo:
# "Tag already exists. No action taken." y después publicaba igual la imagen del tag viejo).
#
# Sin secrets de operación: sólo GITHUB_TOKEN (contents:write para el tag, packages:write para GHCR).
# Actions pineadas por SHA.

name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write   # crear el tag
  packages: write   # publicar en GHCR

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/cannabica/opencogollos

jobs:
  release:
    name: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0   # necesita los tags y el historial

      - name: Leer la versión de composer.json
        id: version
        run: |
          VERSION=$(jq -r '.version // empty' composer.json)
          if [ -z "$VERSION" ]; then
            echo "::error::composer.json no tiene el campo 'version' (el release lo lee de ahí, no del commit)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Versión leída de composer.json: $VERSION (tag v$VERSION)"

      - name: Tag idempotente + guarda contra versión stale
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            EXISTING=$(git rev-list -n1 "$TAG")
            if [ "$EXISTING" != "$GITHUB_SHA" ]; then
              echo "::error::el tag $TAG ya existe y apunta a $EXISTING, pero este push es $GITHUB_SHA. Versión stale en composer.json: bumpearla antes de mergear a main. NO se publica imagen."
              exit 1
            fi
            echo "El tag $TAG ya existía y apunta a este commit: sigo (re-run del mismo release)."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "$TAG" -m "Release $TAG"
            git push origin "$TAG"
            echo "Tag $TAG creado y pusheado."
          fi

      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0

      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@14487ce63c7a62a4a324b0bfb37086795e31c6c1 # v6.16.0
        with:
          context: .
          file: docker/php/Dockerfile
          push: true
          # `latest` acá es sólo una comodidad para consumidores de GHCR: el VPS NO usa este tag
          # (pinea la versión exacta en DOCKER_IMAGE, ver T1.5).
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Resumen del release
        run: |
          {
            echo "### Release ${{ steps.version.outputs.tag }}"
            echo ""
            echo "- Versión leída de \`composer.json\`: \`${{ steps.version.outputs.version }}\`"
            echo "- Imagen: \`${{ env.IMAGE }}:${{ steps.version.outputs.tag }}\` (+ \`latest\`)"
            echo "- Convivencia: el pipeline viejo sigue publicando \`cannabica/cannabica-php\` en Docker Hub y deployando (T3.3 lo saca)."
          } >> "$GITHUB_STEP_SUMMARY"
