name: Staging Deploy

on:
  push:
    tags:
      - '*-staging'

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Deploy to staging
        env:
          DOCKER_HOST: ${{ secrets.STAGING_DOCKER_HOST }}
          DOCKER_TLS_VERIFY: 1
          DOCKER_CERT_PATH: ${{ secrets.STAGING_DOCKER_CERT_PATH }}
          DOCKER_COMPOSE_TLS_VERSION: TLSv1_2
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          STAGING_SSH_HOST: ${{ secrets.STAGING_SSH_HOST }}
          STAGING_SSH_USER: ${{ secrets.STAGING_SSH_USER }}
          STAGING_APP_DIR: ${{ secrets.STAGING_APP_DIR }}
          STAGING_DB_HOST: ${{ secrets.STAGING_DB_HOST }}
          STAGING_DB_PORT: ${{ secrets.STAGING_DB_PORT }}
          STAGING_DB_NAME: ${{ secrets.STAGING_DB_NAME }}
          STAGING_DB_USER: ${{ secrets.STAGING_DB_USER }}
          STAGING_DB_PASSWORD: ${{ secrets.STAGING_DB_PASSWORD }}
          STAGING_APP_ENV: staging
          STAGING_APP_DEBUG: false
          STAGING_APP_URL: ${{ secrets.STAGING_APP_URL }}
          STAGING_APP_KEY: ${{ secrets.STAGING_APP_KEY }}
          STAGING_MAIL_HOST: ${{ secrets.STAGING_MAIL_HOST }}
          STAGING_MAIL_PORT: ${{ secrets.STAGING_MAIL_PORT }}
          STAGING_MAIL_USERNAME: ${{ secrets.STAGING_MAIL_USERNAME }}
          STAGING_MAIL_PASSWORD: ${{ secrets.STAGING_MAIL_PASSWORD }}
          STAGING_MAIL_ENCRYPTION: ${{ secrets.STAGING_MAIL_ENCRYPTION }}
          STAGING_MAIL_FROM_ADDRESS: ${{ secrets.STAGING_MAIL_FROM_ADDRESS }}
          STAGING_MAIL_FROM_NAME: ${{ secrets.STAGING_MAIL_FROM_NAME }}
        run: |
          # Guardar la versión anterior para rollback
          PREVIOUS_VERSION=$(ssh -i <(echo "$STAGING_SSH_KEY") -o StrictHostKeyChecking=no $STAGING_SSH_USER@$STAGING_SSH_HOST "cd $STAGING_APP_DIR && docker-compose -f docker-compose.prod.yml config | grep image | awk '{print \$2}'")
          
          # Desplegar nueva versión
          ssh -i <(echo "$STAGING_SSH_KEY") -o StrictHostKeyChecking=no $STAGING_SSH_USER@$STAGING_SSH_HOST "cd $STAGING_APP_DIR && \
            docker-compose -f docker-compose.prod.yml pull && \
            docker-compose -f docker-compose.prod.yml up -d --force-recreate"
          
          # Esperar a que los contenedores estén listos
          sleep 30
          
          # Health check
          HEALTH_CHECK_URL="$STAGING_APP_URL/health"
          MAX_RETRIES=5
          RETRY_COUNT=0
          
          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            if curl -f "$HEALTH_CHECK_URL"; then
              echo "Health check passed"
              exit 0
            fi
            echo "Health check failed, retrying in 10 seconds..."
            sleep 10
            RETRY_COUNT=$((RETRY_COUNT + 1))
          done
          
          # Si llegamos aquí, el health check falló
          echo "Health check failed after $MAX_RETRIES attempts"
          
          # Rollback
          echo "Initiating rollback to version $PREVIOUS_VERSION"
          ssh -i <(echo "$STAGING_SSH_KEY") -o StrictHostKeyChecking=no $STAGING_SSH_USER@$STAGING_SSH_HOST "cd $STAGING_APP_DIR && \
            docker-compose -f docker-compose.prod.yml down && \
            docker tag $PREVIOUS_VERSION openindoor:latest && \
            docker-compose -f docker-compose.prod.yml up -d"
          
          exit 1 