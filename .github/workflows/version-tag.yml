name: Version Tag

on:
  push:
    branches:
      - develop
      - main
    tags:
      - 'v*.*.*'
      - 'v*.*.*-*'

jobs:
  version:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get version from tag
        id: get_version
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          
          # Extraer componentes de la versión
          if [[ $VERSION =~ ^v([0-9]+)\.([0-9]+)\.([0-9]+)(-.*)?$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            PRERELEASE="${BASH_REMATCH[4]}"
            
            echo "MAJOR=$MAJOR" >> $GITHUB_OUTPUT
            echo "MINOR=$MINOR" >> $GITHUB_OUTPUT
            echo "PATCH=$PATCH" >> $GITHUB_OUTPUT
            echo "PRERELEASE=$PRERELEASE" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ github.ref }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}

  build:
    needs: version
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-buildx-

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          # Construir y subir la imagen con el tag específico
          docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/cannabica:${{ github.ref_name }} .
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/cannabica:${{ github.ref_name }}
          
          # Si es una versión estable (sin prerelease), actualizar latest
          if [[ ! ${{ github.ref_name }} =~ - ]]; then
            docker tag ${{ secrets.DOCKERHUB_USERNAME }}/cannabica:${{ github.ref_name }} ${{ secrets.DOCKERHUB_USERNAME }}/cannabica:latest
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/cannabica:latest
          fi
          
          # Si es una versión de staging, actualizar staging
          if [[ ${{ github.ref_name }} =~ -staging ]]; then
            docker tag ${{ secrets.DOCKERHUB_USERNAME }}/cannabica:${{ github.ref_name }} ${{ secrets.DOCKERHUB_USERNAME }}/cannabica:staging
            docker push ${{ secrets.DOCKERHUB_USERNAME }}/cannabica:staging
          fi

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/cannabica:${{ github.ref_name }}
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH' 