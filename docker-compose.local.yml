services:
  caddy:
    image: caddy:alpine
    ports:
      - "${APP_HTTP_PORT:-8090}:80"
      - "${APP_HTTPS_PORT:-8040}:443"
    env_file:
      - .env.local
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      # Los assets que sirve el `file_server` vienen del volumen compartido con php (que se inicializa
      # desde la IMAGEN, con `public/build` ya compilado). Con un bind mount del código del host, un
      # clone limpio no tiene `public/build` y la app se ve SIN CSS/JS.
      - app_public:/var/www/html/public:ro
      - caddy_data_local:/data
      - caddy_config_local:/config
    depends_on:
      - php
      - mailpit

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      # network: host
    user: "1000:1000"
    env_file:
      - .env.local
    environment:
      - APP_USER_ID=1000
      - APP_GROUP_ID=1000
      - APP_ENV=local
      - APP_DEBUG=true
    expose:
      - "9000"
      - "8000"
    volumes:
      # ⚠️ INSTALACIÓN LIMPIA (el quickstart del README): NO se monta el código del repo ni `vendor/`,
      # `node_modules/` o `public/` del host. Se usan los de la IMAGEN, que se construyó con
      # `composer install` + `npm run build`.
      #
      # Por qué: con `- .:/var/www/html` (y encima `./vendor`, `./node_modules`) un clone fresco deja
      # esos directorios VACÍOS en el contenedor —Docker crea las carpetas del host y las monta encima—
      # → `php artisan` devuelve 255 → el entrypoint muere en `migrate --force` (30 reintentos) →
      # php-fpm no arranca → 502 del proxy. Medido: 2026-09-27, `board/epicas/2026-09-27-prueba-tercero-hallazgos.md`.
      #
      # Para DESARROLLO con hot-reload está `docker-compose.dev.yml` (ver README §Desarrollo).
      - app_public:/var/www/html/public
      - laravel_storage:/var/www/html/storage
    working_dir: /var/www/html
    depends_on:
      - db

  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    env_file:
      - .env.local
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  adminer: #TMP
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data_dev:
  laravel_storage:
  # Compartido entre php y caddy: se inicializa con el `public/` de la imagen (incluye `build/`).
  # `php` lo monta primero (caddy tiene `depends_on: php`), así que el contenido es el de la imagen.
  app_public:
  caddy_data_local:
  caddy_config_local:
