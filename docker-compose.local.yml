version: '3'

services:
  nginx:
    image: nginx:alpine
    ports:
      - "8090:80"
    volumes:
      - ./default.local.conf:/etc/nginx/conf.d/default.conf
      - .:/var/www/html
    depends_on:
      - php
      - mailpit

  php:
    build: .
    user: "1000:1000"
    env_file: .env.local
    environment:
      - APP_USER_ID=1000
      - APP_GROUP_ID=1000
      - APP_ENV=local
      - APP_DEBUG=true
    expose:
      - "9000"
    volumes:
      - .:/var/www/html
      - ./vendor:/var/www/html/vendor
      - ./node_modules:/var/www/html/node_modules
      - ./storage:/var/www/html/storage
    working_dir: /var/www/html
    depends_on:
      - db

  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    env_file:
      - .env.local
    ports:
      - "5433:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: cannabica_dev
      POSTGRES_USER: cannabica_dev
      POSTGRES_PASSWORD: devpassword

  adminer:
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data_dev:
  laravel_storage:
  laravel_logs: