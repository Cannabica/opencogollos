services:
  caddy:
    image: caddy:alpine
    ports:
      - "${APP_HTTP_PORT:-8090}:80"
      - "${APP_HTTPS_PORT:-8040}:443"
    env_file:
      - .env.local
    volumes:
      - ./Caddyfile.local:/etc/caddy/Caddyfile:ro
      # Los assets que sirve el `file_server` vienen del volumen compartido con php (que se inicializa
      # desde la IMAGEN, con `public/build` ya compilado). Con un bind mount del código del host, un
      # clone limpio no tiene `public/build` y la app se ve SIN CSS/JS.
      - app_public:/var/www/html/public:ro
      - caddy_data_local:/data
      - caddy_config_local:/config
    depends_on:
      - php
      - mailpit

  php:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      # network: host
    user: "1000:1000"
    env_file:
      - .env.local
    environment:
      - APP_USER_ID=1000
      - APP_GROUP_ID=1000
      - APP_ENV=local
      - APP_DEBUG=true
    expose:
      - "9000"
      - "8000"
    volumes:
      # El quickstart no puede depender de que el host tenga PHP/Composer/Node (es la promesa del
      # README): el CÓDIGO se monta desde el clone (existe siempre) y lo que un clone NO trae —
      # `vendor/`, `node_modules/`, `public/build/` — viene de la IMAGEN por volúmenes, que Docker
      # inicializa con el contenido de la imagen en ese path.
      #
      # Por qué no `- ./vendor:/...` y `- ./node_modules:/...`: en un clone fresco esos directorios no
      # existen, Docker crea carpetas vacías en el host y las monta ENCIMA de las deps de la imagen →
      # `php artisan` devuelve 255 → el entrypoint muere en `migrate --force` (30 reintentos) → php-fpm
      # no arranca → 502 del proxy. Medido 2026-09-27
      # (`board/epicas/2026-09-27-prueba-tercero-hallazgos.md`).
      #
      # `storage/` y `bootstrap/cache/` SÍ van del host (los trae el clone y el proceso corre como
      # uid 1000): si se toman de la imagen quedan con dueño `www-data` y el contenedor no puede
      # escribir los logs (`Permission denied` → el entrypoint falla igual).
      - .:/var/www/html
      - app_vendor:/var/www/html/vendor
      - app_node_modules:/var/www/html/node_modules
      - app_public:/var/www/html/public
    working_dir: /var/www/html
    depends_on:
      - db

  db:
    build:
      context: .
      dockerfile: docker/db/Dockerfile
    env_file:
      - .env.local
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}

  adminer: #TMP
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db

  mailpit:
    image: axllent/mailpit
    ports:
      - "8025:8025"
      - "1025:1025"

volumes:
  postgres_data_dev:
  # Los tres volúmenes que se inicializan desde la IMAGEN (php) y hacen que el quickstart no necesite
  # nada instalado en el host. `app_public` además se comparte con caddy (los assets compilados que
  # sirve su `file_server`).
  app_vendor:
  app_node_modules:
  app_public:
  caddy_data_local:
  caddy_config_local:
