# Emulador local del Bot API de Telegram — OpenIndoor
#
# Es un server HTTP sin dependencias (PHP stdlib) que emula el subconjunto del
# Bot API que usa la app y agrega un plano de control para inyectar updates y
# leer los mensajes salientes. No habla con Telegram: sirve para desarrollar y
# testear los bots sin internet, sin bot real y sin api_id/api_hash.
#
# Levantar (proyecto propio, para no compartir namespace con el stack local):
#   docker compose -f docker-compose.telegram-emulator.yml -p tg-emulator up -d
#   curl -s http://127.0.0.1:8082/_emulator/health
#
# Bajar (y borrar el estado):
#   docker compose -f docker-compose.telegram-emulator.yml -p tg-emulator down -v
#
# Detalles y plano de control: tools/telegram-emulator/README.md
services:
  tg-emulator:
    image: php:8.3-cli-alpine
    command: ["php", "-S", "0.0.0.0:8082", "/app/server.php"]
    environment:
      # php -S es single-thread y el camino inject -> webhook -> sendMessage ->
      # emulador vuelve a entrar: sin workers el inject deadlockea.
      PHP_CLI_SERVER_WORKERS: "4"
      TELEGRAM_EMULATOR_HOST: 0.0.0.0
      TELEGRAM_EMULATOR_PORT: "8082"
      TELEGRAM_EMULATOR_STATE: /state/state.json
    ports:
      - "${TELEGRAM_EMULATOR_PORT:-8082}:8082"
    volumes:
      # Sólo el emulador (el repo NO se monta entero: no hay por qué exponer .env).
      - ./tools/telegram-emulator:/app:ro
      - tg_emulator_state:/state
    # Para que un emulador en Docker pueda entregarle el update a una app que
    # corre en el host (webhook http://host.docker.internal:8095/...).
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  tg_emulator_state:
