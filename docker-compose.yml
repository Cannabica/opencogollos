services:
  caddy:
    image: caddy:alpine
    ports:
      - "${APP_HTTP_PORT:-8090}:80"
      - "${APP_HTTPS_PORT:-8040}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - public-php:/var/www/html/public:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./logs/caddy:/var/log/caddy
    depends_on:
      php:
        condition: service_healthy
      uptime-kuma:
        condition: service_started
    networks:
      - app_network
    restart: unless-stopped

  php:
    image: ${DOCKER_IMAGE:-cannabica/cannabica-php:latest}
    user: "82:82"
    env_file:
      - .env
    environment:
      - APP_NAME=${APP_NAME:-OpenIndoor}
      - APP_ENV=${APP_ENV:-production}
      - APP_DEBUG=${APP_DEBUG:-false}
      - APP_KEY=${APP_KEY}
      - APP_URL=${APP_URL:-https://plataforma.cannabica.ar}
      - DB_CONNECTION=${DB_CONNECTION:-pgsql}
      - DB_HOST=${DB_HOST:-db}
      - DB_PORT=${DB_PORT:-5432}
      - DB_DATABASE=${DB_DATABASE}
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - SEED_EXAMPLE_DATA=${SEED_EXAMPLE_DATA:-false}
      - QUEUE_CONNECTION=${QUEUE_CONNECTION:-database}
      - SESSION_DRIVER=${SESSION_DRIVER:-database}
      - CACHE_DRIVER=${CACHE_DRIVER:-redis}
      - MAIL_MAILER=${MAIL_MAILER:-smtp}
      - MAIL_HOST=${MAIL_HOST:-smtp.mailgun.org}
      - MAIL_PORT=${MAIL_PORT:-587}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_ENCRYPTION=${MAIL_ENCRYPTION:-tls}
      - MAIL_FROM_ADDRESS=${MAIL_FROM_ADDRESS:-noreply@cannabica.app}
      - MAIL_FROM_NAME=${MAIL_FROM_NAME:-${APP_NAME:-OpenIndoor}}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - JWT_SECRET=${JWT_SECRET}
      - TELEGRAM_MAX_PLANTS_PER_PAGE=${TELEGRAM_MAX_PLANTS_PER_PAGE:-101}
      - TELEGRAM_PHOTO_MAX_SIZE=${TELEGRAM_PHOTO_MAX_SIZE:-5120}
      - TELEGRAM_WEBHOOK_URL=${TELEGRAM_WEBHOOK_URL:-https://plataforma.cannabica.ar/api/telegram/webhook/}
      - XDG_CONFIG_HOME=${XDG_CONFIG_HOME:-/var/www/html/.config}
    volumes:
      - public-php:/var/www/html/public
      - laravel_storage:/var/www/html/storage
      - ./storage/logs:/var/www/html/storage/logs
      - php-fpm-logs:/var/log/php-fpm
      - ./www.conf:/usr/local/etc/pp-fpm.d/www.conf
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "ps aux | grep '[p]hp-fpm: master process' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - app_network

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: uptime-kuma
    restart: unless-stopped
    volumes:
      - uptime-kuma-data:/app/data
      - ./docker/uptime-kuma:/app/data/configs
    networks:
      - app_network

  db:
    image: postgres:15
    env_file:
      - .env
    environment:
      - POSTGRES_DB=${DB_DATABASE}
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - app_network

  loki:
    image: grafana/loki:3.0.0
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yaml -config.expand-env=true
    volumes:
      - ./docker/loki/loki-config.yaml:/etc/loki/config.yaml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks:
      - app_network

  promtail:
    image: grafana/promtail:3.0.0
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/promtail/promtail-config.yaml:/etc/promtail/config.yaml:ro
    command: -config.file=/etc/promtail/config.yaml -config.expand-env=true
    restart: unless-stopped
    networks:
      - app_network

  grafana:
    image: grafana/grafana:11.0.0
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./docker/grafana-provisioning/dashboards-config:/etc/grafana/provisioning/dashboards:ro
      - ./docker/grafana-provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./docker/grafana-provisioning/dashboards:/etc/grafana/dashboards:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    restart: unless-stopped
    networks:
      - app_network

  adminer: #TMP
    profiles: ["debug"]
    image: adminer
    ports:
      - "8080:8080"
    depends_on:
      - db
    networks:
      - app_network


volumes:
  uptime-kuma-data:
  postgres_data:
  php-fpm-logs:
  caddy_data:
  caddy_config:
  public-php:
  laravel_storage:
  grafana_data:
  loki_data:

networks:
  app_network:
    driver: bridge 